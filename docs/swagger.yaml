basePath: /
definitions:
  internal_api_models.DiskSource:
    properties:
      clone:
        example: disk-eid
        type: string
      snapshot:
        example: snapshot-eid
        type: string
      type:
        description: blank, http, snapshot, clone, registry
        example: blank
        type: string
      url:
        example: http://example.com/image.qcow2
        type: string
    type: object
  internal_api_models.EgressRule:
    properties:
      allowAll:
        type: boolean
      denyAll:
        type: boolean
      ports:
        items:
          $ref: '#/definitions/internal_api_models.SgPort'
        type: array
      to:
        items:
          $ref: '#/definitions/internal_api_models.Peer'
        type: array
    type: object
  internal_api_models.IPBlock:
    properties:
      CIDR:
        type: string
      Except:
        items:
          type: string
        type: array
    type: object
  internal_api_models.IngressRule:
    properties:
      allowAll:
        type: boolean
      denyAll:
        type: boolean
      from:
        items:
          $ref: '#/definitions/internal_api_models.Peer'
        type: array
      ports:
        items:
          $ref: '#/definitions/internal_api_models.SgPort'
        type: array
    type: object
  internal_api_models.LabelSelector:
    properties:
      matchExpressions:
        items:
          $ref: '#/definitions/internal_api_models.MatchExpression'
        type: array
      matchLabels:
        items:
          type: string
        type: array
    type: object
  internal_api_models.MatchExpression:
    properties:
      key:
        type: string
      operator:
        type: string
      values:
        items:
          type: string
        type: array
    type: object
  internal_api_models.Peer:
    properties:
      IPBlock:
        $ref: '#/definitions/internal_api_models.IPBlock'
      podSelector:
        $ref: '#/definitions/internal_api_models.LabelSelector'
    type: object
  internal_api_models.SgPort:
    properties:
      endPort:
        type: integer
      port:
        type: integer
      protocol:
        type: string
    type: object
  internal_api_models.StaticRoute:
    properties:
      cidr:
        example: 192.168.0.0/24
        type: string
      next_hop_ip:
        example: 10.0.0.254
        type: string
      policy:
        description: policyDst or policySrc
        example: policyDst
        type: string
      route_table:
        description: Subnet EID
        example: subnet-eid
        type: string
    type: object
  models.Disk:
    properties:
      az:
        example: az1
        type: string
      id:
        example: disk-12345
        type: string
      labels:
        items:
          type: string
        type: array
      name:
        example: mon-disque
        type: string
      size:
        example: 10
        type: integer
      source:
        $ref: '#/definitions/internal_api_models.DiskSource'
      storage_class:
        example: standard
        type: string
    type: object
  models.DiskRequest:
    properties:
      labels:
        description: Labels in the "user.superphenix.net/key:value" format
        items:
          type: string
        type: array
      name:
        example: mon-disque
        type: string
      size:
        example: 10
        type: integer
      source:
        $ref: '#/definitions/internal_api_models.DiskSource'
      storage_class:
        example: standard
        type: string
    type: object
  models.Eip:
    properties:
      az:
        example: az1
        type: string
      dnat:
        items:
          $ref: '#/definitions/models.EipDNAT'
        type: array
      external_ip:
        example: 1.2.3.4
        type: string
      id:
        example: eip-12345
        type: string
      internal_ip:
        example: 10.0.0.5
        type: string
      name:
        example: mon-eip
        type: string
      nat:
        example: fip
        type: string
      snat:
        example:
        - 10.0.0.10
        - 10.0.0.11
        items:
          type: string
        type: array
      subnet_id:
        example: subnet-123
        type: string
    type: object
  models.EipDNAT:
    properties:
      external_port:
        example: "80"
        type: string
      internal_ip:
        example: 10.0.0.10
        type: string
      internal_port:
        example: "8080"
        type: string
      protocol:
        example: tcp
        type: string
    type: object
  models.EipRequest:
    properties:
      dnat:
        items:
          $ref: '#/definitions/models.EipDNAT'
        type: array
      internal_ip:
        example: 10.0.0.5
        type: string
      name:
        example: mon-eip
        type: string
      snat:
        items:
          type: string
        type: array
      subnet_id:
        example: subnet-123
        type: string
    type: object
  models.SSHKey:
    properties:
      fingerprint:
        type: string
      id:
        type: string
      name:
        type: string
      publicKey:
        type: string
    type: object
  models.SSHKeyRequest:
    properties:
      name:
        type: string
      publicKey:
        type: string
    type: object
  models.SecurityGroup:
    properties:
      description:
        type: string
      egress:
        items:
          $ref: '#/definitions/internal_api_models.EgressRule'
        type: array
      id:
        type: string
      ingress:
        items:
          $ref: '#/definitions/internal_api_models.IngressRule'
        type: array
      name:
        type: string
      subnetIds:
        items:
          type: string
        type: array
      target:
        $ref: '#/definitions/internal_api_models.LabelSelector'
    type: object
  models.SecurityGroupRequest:
    properties:
      description:
        type: string
      egress:
        items:
          $ref: '#/definitions/internal_api_models.EgressRule'
        type: array
      ingress:
        items:
          $ref: '#/definitions/internal_api_models.IngressRule'
        type: array
      name:
        type: string
      subnetIds:
        description: SubnetIDs limits the security group to these subnets (empty =
          all subnets)
        items:
          type: string
        type: array
      target:
        $ref: '#/definitions/internal_api_models.LabelSelector'
    required:
    - name
    type: object
  models.Subnet:
    properties:
      az:
        example: az1
        type: string
      dns_v4:
        example: 8.8.8.8
        type: string
      dns_v6:
        example: 2001:4860:4860::8888
        type: string
      id:
        example: subnet-12345
        type: string
      ipv4:
        example: 10.0.1.0/24
        type: string
      ipv6:
        example: 2001:db8::/64
        type: string
      name:
        example: mon-subnet
        type: string
      nat_gateway:
        example: false
        type: boolean
      nat_gateway_ip:
        example: 10.0.1.1
        type: string
      private:
        example: true
        type: boolean
      protocol:
        example: IPv4
        type: string
      vpc_id:
        example: vpc-12345
        type: string
    type: object
  models.SubnetRequest:
    properties:
      dns_v4:
        example: 8.8.8.8
        type: string
      dns_v6:
        example: 2001:4860:4860::8888
        type: string
      ipv4:
        example: 10.0.1.0/24
        type: string
      ipv6:
        example: 2001:db8::/64
        type: string
      name:
        example: mon-subnet
        type: string
      nat_gateway:
        example: false
        type: boolean
      private:
        example: true
        type: boolean
      protocol:
        example: IPv4
        type: string
      vpc_id:
        example: vpc-12345
        type: string
    type: object
  models.VPC:
    properties:
      az:
        example: az1
        type: string
      id:
        example: vpc-12345
        type: string
      name:
        example: mon-vpc-reseau
        type: string
      static_routes:
        items:
          $ref: '#/definitions/internal_api_models.StaticRoute'
        type: array
    type: object
  models.VPCRequest:
    properties:
      name:
        example: mon-vpc-reseau
        type: string
      static_routes:
        description: 'StaticRoutes (update only): nil = existing routes kept, [] =
          all removed'
        items:
          $ref: '#/definitions/internal_api_models.StaticRoute'
        type: array
    type: object
